<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alex Morgan — Profile</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--text:#14171f;--muted:#5d6577;--accent:#4f46e5;--accent-t:#fff;--line:#e3e6ec;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1015;--card:#181b23;--text:#f1f3f8;--muted:#98a1b5;--accent:#818cf8;--accent-t:#0e1015;--line:#272b36;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1015;--card:#181b23;--text:#f1f3f8;--muted:#98a1b5;--accent:#818cf8;--accent-t:#0e1015;--line:#272b36;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;justify-content:center;padding:24px 16px}
.wrap{width:100%;max-width:420px}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:32px 24px;text-align:center}
.avatar{width:96px;height:96px;border-radius:50%;margin:0 auto 16px;background:var(--accent);color:var(--accent-t);display:grid;place-items:center;font-size:36px;font-weight:700}
h1{margin:0;font-size:24px}
.role{margin:4px 0 0;color:var(--muted);font-size:15px}
.bio{margin:16px 0 24px;color:var(--muted);line-height:1.5;font-size:15px}
.links{display:flex;flex-direction:column;gap:10px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:transparent;color:var(--text);text-decoration:none;font-size:16px;font-weight:600;cursor:pointer;font-family:inherit}
.btn.primary{background:var(--accent);color:var(--accent-t);border-color:var(--accent)}
.btn:active{transform:scale(.98)}
.foot{margin-top:20px;font-size:13px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
</style>
</head>
<body>
<main class="wrap">
  <section class="card">
    <div class="avatar">AM</div>
    <h1>Alex Morgan</h1>
    <p class="role">Product Designer · Almaty</p>
    <p class="bio">I design clean, useful products. Let’s connect — tap a button below to reach me.</p>
    <div class="links">
      <a class="btn primary" href="tel:+77001234567">📞 Call me</a>
      <a class="btn" href="https://wa.me/77001234567">💬 WhatsApp</a>
      <a class="btn" href="https://t.me/username">✈️ Telegram</a>
      <a class="btn" href="mailto:alex@example.com">✉️ Email</a>
      <a class="btn" href="https://instagram.com/username">📷 Instagram</a>
      <a class="btn" href="https://linkedin.com/in/username">💼 LinkedIn</a>
      <button class="btn" id="share" type="button">🔗 Share this card</button>
    </div>
    <p class="foot">Tapped via NFC</p>
  </section>
</main>
<div class="toast" id="toast">Link copied</div>
<script>
(function(){
  var t=document.getElementById('toast');
  function show(m){t.textContent=m;t.classList.add('show');setTimeout(function(){t.classList.remove('show')},1800)}
  document.getElementById('share').addEventListener('click',function(){
    var url=location.href;
    try{
      if(navigator.share){navigator.share({title:document.title,url:url}).catch(function(){});return}
    }catch(e){}
    try{navigator.clipboard.writeText(url).then(function(){show('Link copied')},function(){show('Copy the address bar link')})}
    catch(e){show('Copy the address bar link')}
  });
})();
</script>
</body>
</html>
